components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExampleOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ExampleOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          examples:
            - Hello from v1!
          type: string
      required:
        - message
      type: object
    HealthzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthzOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Always ok while the process is serving requests.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    ListProjectsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProjectsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Project"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Project:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Project.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
        lastActivityAt:
          format: date-time
          type: string
        name:
          type: string
        path:
          description: Namespace and project path, as in the URL.
          type: string
        webUrl:
          format: uri
          type: string
      required:
        - id
        - name
        - path
        - webUrl
      type: object
    ReadyzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadyzOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          additionalProperties:
            type: string
          description: Result of each readiness check by name.
          type: object
        status:
          description: ok when every check passed.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    RootOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RootOutputBody.json
          format: uri
          readOnly: true
          type: string
        version:
          description: API version served under this prefix.
          enum:
            - v1
          type: string
      required:
        - version
      type: object
    VersionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/VersionOutputBody.json
          format: uri
          readOnly: true
          type: string
        version:
          description: Build version, the same for the API and web images of one release.
          type: string
      required:
        - version
      type: object
info:
  title: Ginkit API
  version: dev
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Returns 200 whenever the process is up and able to serve requests.
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - Health
  /readyz:
    get:
      description: Runs every readiness check. Returns 200 when all pass, or 503 listing each check that failed. Also returns 503 once the service has started shutting down.
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness probe
      tags:
        - Health
  /v1:
    get:
      operationId: v1-root
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: API v1 root
      tags:
        - v1
  /v1/example:
    get:
      operationId: v1-example
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Example v1 route
      tags:
        - v1
  /v1/projects:
    get:
      description: Projects the configured token can see, most recently active first.
      operationId: v1-list-projects
      parameters:
        - description: Matches project names and paths.
          explode: false
          in: query
          name: search
          schema:
            description: Matches project names and paths.
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsOutputBody"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: List GitLab projects
      tags:
        - v1
  /v1/projects/{id}:
    get:
      operationId: v1-get-project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: One GitLab project
      tags:
        - v1
  /version:
    get:
      description: The version this binary was built with. The web app's /readyz compares it with its own.
      operationId: version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Build version
      tags:
        - Health
