components:
  schemas:
    Customer:
      additionalProperties: true
      properties:
        country:
          description: ISO 3166-1 alpha-2 code.
          examples:
            - DK
          pattern: ^[A-Z]{2}$
          type: string
        email:
          examples:
            - ada@example.com
          format: email
          type: string
        name:
          examples:
            - Ada Lovelace
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
        - email
        - country
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExampleOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ExampleOutputBody.json
          format: uri
          readOnly: true
          type: string
        message:
          examples:
            - Hello from v1!
          type: string
      required:
        - message
      type: object
    GetPriceOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetPriceOutputBody.json
          format: uri
          readOnly: true
          type: string
        amount:
          examples:
            - 97.36
          format: double
          type: number
        currency:
          examples:
            - USD
          type: string
        productId:
          examples:
            - p-1001
          type: string
        rate:
          description: EUR to currency rate applied.
          examples:
            - 1.094
          format: double
          type: number
      required:
        - productId
        - currency
        - amount
        - rate
      type: object
    HealthzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/HealthzOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          description: Always ok while the process is serving requests.
          enum:
            - ok
          type: string
        version:
          description: Build version, the same for the API and web images of one release.
          type: string
      required:
        - status
        - version
      type: object
    ListProductsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListProductsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Product"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    Product:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Product.json
          format: uri
          readOnly: true
          type: string
        id:
          examples:
            - p-1001
          pattern: ^p-[0-9]+$
          type: string
        name:
          examples:
            - Keyboard
          type: string
        price:
          description: Price in EUR.
          examples:
            - 89
          format: double
          minimum: 0
          type: number
        tags:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - id
        - name
        - price
      type: object
    Quote:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Quote.json
          format: uri
          readOnly: true
          type: string
        currency:
          enum:
            - EUR
          type: string
        discount:
          format: double
          type: number
        expiresAt:
          format: date-time
          type: string
        lines:
          items:
            $ref: "#/components/schemas/QuoteItem"
          type:
            - array
            - "null"
        shipping:
          format: double
          type: number
        subtotal:
          format: double
          type: number
        total:
          format: double
          type: number
      required:
        - currency
        - lines
        - subtotal
        - discount
        - shipping
        - total
        - expiresAt
      type: object
    QuoteItem:
      additionalProperties: false
      properties:
        name:
          type: string
        productId:
          type: string
        quantity:
          format: int64
          type: integer
        total:
          format: double
          type: number
        unitPrice:
          format: double
          type: number
      required:
        - productId
        - name
        - quantity
        - unitPrice
        - total
      type: object
    QuoteLine:
      additionalProperties: false
      properties:
        productId:
          examples:
            - p-1001
          pattern: ^p-[0-9]+$
          type: string
        quantity:
          examples:
            - 2
          format: int64
          maximum: 999
          minimum: 1
          type: integer
      required:
        - productId
        - quantity
      type: object
    QuoteRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/QuoteRequest.json
          format: uri
          readOnly: true
          type: string
        coupon:
          description: SAVE10 is the only code the example knows.
          pattern: ^[A-Z0-9]{4,12}$
          type: string
        customer:
          $ref: "#/components/schemas/Customer"
        lines:
          items:
            $ref: "#/components/schemas/QuoteLine"
          maxItems: 50
          minItems: 1
          type:
            - array
            - "null"
        notes:
          additionalProperties: {}
          description: Any object the client wants to attach.
          type: object
        shipping:
          default: standard
          enum:
            - standard
            - express
          type: string
      required:
        - lines
        - customer
      type: object
    ReadyzOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ReadyzOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          additionalProperties:
            type: string
          description: Result of each readiness check by name.
          type: object
        status:
          description: ok when every check passed.
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    RootOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/RootOutputBody.json
          format: uri
          readOnly: true
          type: string
        version:
          description: API version served under this prefix.
          enum:
            - v1
          type: string
      required:
        - version
      type: object
info:
  title: Ginkit API
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Returns 200 whenever the process is up and able to serve requests.
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - Health
  /readyz:
    get:
      description: Runs every readiness check. Returns 200 when all pass, or 503 listing each check that failed. Also returns 503 once the service has started shutting down.
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzOutputBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Readiness probe
      tags:
        - Health
  /v1:
    get:
      operationId: v1-root
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: API v1 root
      tags:
        - v1
  /v1/example:
    get:
      operationId: v1-example
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Example v1 route
      tags:
        - v1
  /v1/products:
    get:
      description: Filters and pages through query parameters and reports the unpaged count in a header.
      operationId: v1-list-products
      parameters:
        - description: Only products carrying this tag.
          explode: false
          in: query
          name: tag
          schema:
            description: Only products carrying this tag.
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProductsOutputBody"
          description: OK
          headers:
            X-Total-Count:
              schema:
                description: Matching products before paging.
                format: int64
                type: integer
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List products
      tags:
        - v1
  /v1/products/{id}:
    get:
      operationId: v1-get-product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - p-1001
            pattern: ^p-[0-9]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a product
      tags:
        - v1
  /v1/products/{id}/price:
    get:
      description: Converts the EUR price with a rate from the exchange-rate client that main builds once.
      operationId: v1-get-product-price
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - p-1001
            pattern: ^p-[0-9]+$
            type: string
        - description: ISO 4217 code to quote the price in.
          explode: false
          in: query
          name: currency
          schema:
            default: EUR
            description: ISO 4217 code to quote the price in.
            pattern: ^[A-Z]{3}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPriceOutputBody"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Gateway
      summary: Price in a currency
      tags:
        - v1
  /v1/quotes:
    post:
      description: Validates the body against QuoteRequest and prices it from the catalog. Nothing is stored.
      operationId: v1-create-quote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Quote an order
      tags:
        - v1
